{% extends "admin/base_site.html" %}

{% block content %}
<div class="overflow-x-auto rounded-default border border-base-200 bg-white shadow-xs dark:border-base-800 dark:bg-base-900">
    <table id="result_list" class="result-list w-full border-separate border-spacing-none">
        <thead>
            <tr>
                <th class="align-middle px-3 py-2 text-start font-semibold text-base-500">فایل</th>
            </tr>
        </thead>
        <tbody>
            {% for name in files %}
                <tr>
                    <td class="border-t border-base-200 px-3 py-3 text-start dark:border-base-800">
                        <a href="{% url 'admin:data_file' name %}">{{ name }}</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td class="px-3 py-3 text-start">فایل HTMLای این‌جا نیست.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
