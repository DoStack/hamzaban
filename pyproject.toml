[project]
name = "hamzaban"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2",
  "psycopg2-binary>=2.9",
  "django-unfold>=0.43",
  "django-storages>=1.14",
  "boto3>=1.35",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "sh scripts/vercel_release.sh"
